[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "insights-core-messaging-kafka"
dynamic = ["version"]
readme = {file = "../../README.md", content-type = "text/markdown"}
maintainers = [
    {name="CCX Processing Team", email="ccx-core-processing-team@redhat.com"}
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

requires-python = ">= 3.11"
dependencies = [
    "insights-core-messaging-base",
    "confluent-kafka",
    "prometheus_client",
]

license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/RedHatInsights/insights-core-messaging"

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
only-include = ["_"]

[tool.hatch.build.targets.wheel.force-include]
"../../insights_messaging/consumers/kafka.py" = "insights_messaging/consumers/kafka.py"
"../../insights_messaging/requeuers/kafka.py" = "insights_messaging/requeuers/kafka.py"
"../../insights_messaging/utils/retry.py" = "insights_messaging/utils/retry.py"
