name: Publish Python distributions to PyPI

on:
  push:

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - all-in-one
          - base
          - http
          - kafka

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build distribution
      run: uv build --package ${{ matrix.package == 'all-in-one' && 'insights-core-messaging' || format('insights-core-messaging-{0}', matrix.package) }}
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: dist/

  publish-to-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - all-in-one
          - base
          - http
          - kafka
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package == 'all-in-one' && 'insights-core-messaging' || format('insights-core-messaging-{0}', matrix.package) }}
    permissions:
      id-token: write

    steps:
    - name: Download distribution
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
